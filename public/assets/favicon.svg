<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#0E1322" />
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="url(#grad)" stroke-width="2.5" opacity="0.6"/>
  <!-- TV Monitor Frame -->
  <rect x="22" y="24" width="56" height="42" rx="8" fill="#182038" stroke="url(#grad)" stroke-width="2.5" />
  <!-- Screen Glow Play Button -->
  <polygon points="45,36 62,45 45,54" fill="url(#grad)" filter="url(#glow)" />
  <!-- TV Antenna / Signal Waves -->
  <path d="M36 17 L44 24" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M64 17 L56 24" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- TV Stand Base -->
  <path d="M42 66 L38 78 L62 78 L58 66" stroke="url(#grad)" stroke-width="2.5" stroke-linejoin="round" fill="#182038"/>
</svg>
